<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Carga táctica: cuerpo de acero (sello ofensivo / cartucho listo) + chispa de detonación -->
  <path d="M9.5 12 Q16 2.5 22.5 12 Z" fill="#8a8f98" stroke="#3a3c42" stroke-width="1"/>
  <rect x="9" y="11.5" width="14" height="12" rx="1.5" fill="#8a8f98" stroke="#3a3c42" stroke-width="1"/>
  <rect x="7" y="23" width="18" height="3" rx="1" fill="#8a8f98" stroke="#3a3c42" stroke-width="1"/>

  <!-- Sombra inferior/derecha del cuerpo -->
  <rect x="18.5" y="12" width="4.5" height="14" fill="#3a3c42" opacity="0.35"/>
  <rect x="17.5" y="23" width="7.5" height="3" fill="#3a3c42" opacity="0.3"/>

  <!-- Highlight superior/izquierdo -->
  <path d="M10.2 11.3 Q16 3.4 20.8 9.6" stroke="#c8ccd2" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Chispa de detonación (ámbar/rojo controlado) -->
  <path d="M20 5 L24.5 3.8 L22 8 Z" fill="#ff6a1a" stroke="#a83000" stroke-width="0.6"/>
  <path d="M21.8 9 L26.5 7.8 L23.2 12.2 Z" fill="#ff6a1a" stroke="#a83000" stroke-width="0.6"/>
</svg>
