<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="rf-brushed-seamless" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.6" numOctaves="4" stitchTiles="stitch" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18" intercept="-0.02"/></feComponentTransfer>
    </filter>
    <filter id="rf-grain-seamless" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch" seed="42"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12" intercept="-0.01"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#1b1c20"/>
  <rect width="512" height="512" filter="url(#rf-brushed-seamless)" opacity="0.8"/>
  <rect width="512" height="512" filter="url(#rf-grain-seamless)" opacity="0.5"/>
</svg>
